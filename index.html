const NOWHERE = 0, CARRIED = 255;
const logEl = document.getElementById('log');

const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l');
const eq = (a, b) => a !== null && fold(a) === fold(b);
const hasArg = () => o2 !== null;
const isBeer = () => hasArg() && fold(o2).startsWith('piwo');

function say(text, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = text;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}

function banner() {
  say('Pięć gówien Eepcha', 'banner-title');
  say('Wersja 2026 mini HTML - poprawiona', 'banner-note');
}

function newGame() {
  S = {loc: 0, money: 50000, zatoczka: 0, rybak: 0, sram: 0, szkat: 0, prad: 0, gosp: 0, drzewo: 0, siad: 0,
       item: 0, ended: false, confirmQuit: false, exits: D.exits.map(r => r.slice()), obj: D.obj.slice()};
}

function itemFind(name) {
  for (let i = 1; i <= 22; i++) if (eq(D.names[i], name)) return i;
  return 0;
}

function check() {
  if (!hasArg()) { say('Ale co ??'); return false; }
  S.item = itemFind(o2);
  if (!S.item) { say('Nie znam takiego przedmiotu.'); return false; }
  return true;
}

function checkCarried() {
  if (S.obj[S.item] !== CARRIED) { say('Nie niesiesz tego przedmiotu!'); return false; }
  return true;
}

function listItems(where) {
  const out = [];
  for (let i = 1; i <= 22; i++) if (S.obj[i] === where) out.push(D.names[i]);
  return out;
}

function inv() {
  const l = listItems(CARRIED);
  say('Niesiesz: ' + (l.length ? l.join(', ') : 'nic'), 'list');
}

function endGame(lines) {
  lines.forEach(l => say(l));
  say('Grasz jeszcze raz? (T/N)');
  S.ended = true;
}

function special() {
  const s = S;
  if (s.loc === 4 && s.szkat !== 0) say('W wykopanym dołku leży ' + (s.szkat === 2 ? 'otwarta ' : '') + 'szkatuła.');
  if (s.loc === 5 && s.rybak !== 2) {
    say('Jest tu stary, zalany rybak.' + (s.rybak === 0 ? ' Mówi, że chciałby się czegoś napić.' : ' Mówi, że poszedłby na rybki.'));
  }
  if (s.loc === 13 && s.zatoczka === 0) say('W zatoczce po drugiej stronie rzeczki pływa sobie gówno.');
  if (s.loc === 1 && s.drzewo === 1) say('Drzewo jest ścięte.');
  if (s.loc === 23 && s.gosp === 1) say('Gospodarz nie żyje.');
  const dung = [4, 13, 15, 17, 20];
  if (dung.every(i => s.obj[i] === CARRIED)) {
    dung.forEach(i => { s.obj[i] = NOWHERE; });
    s.obj[21] = CARRIED;
    say('Ha!');
    inv();
  }
  if (s.sram === 1) say('Swędzi cię dupa.');
}

function location() {
  if (S.loc === 0) {
    D.text[0].forEach(t => say(t));
    S.loc = 1;
  }
  D.text[S.loc].forEach(t => say(t));
  special();
  const here = listItems(S.loc);
  say('Widzisz: ' + (here.length ? here.join(', ') : 'nic'), 'list');
  const ex = [];
  for (let d = 0; d < 6; d++) if (S.exits[d][S.loc]) ex.push(D.dirs[d]);
  say('Wyjścia: ' + (ex.length ? ex.join(', ') : 'nie ma'), 'list');
}

function sign() {
  if (S.loc === 4) { say(' Tu leży\n  Johny Mc Vawakh (1921-1991)\nOstatni hodowca i obrońca Eepchów'); }
  if (S.loc === 9) { say(' Zamek księcia Bolka Miękkiego\nPana Wałlandii i Wysp Jeulandzkich\n Nieupoważnionym wstęp wzbroniony.'); }
  if (S.loc === 18) { say(' Uwaga! Klamka i druty pod napięciem!'); }
}

    location();
  },
  take() {
    if (eq(o2, 'gówno')) { say('Musisz jeszcze podać jego numer!'); return; }
    if (!check()) return;
    if (S.obj[S.item] !== S.loc) { say('Nie ma tu tego przedmiotu!'); return; }
    S.obj[S.item] = CARRIED;
    say('O.k.');
    inv();
  },
  examine() {
    if (!hasArg()) { say('Ale co ??'); return; }
    if (eq(o2, 'portfel')) { say('Masz w nim ' + S.money + ' złotych.'); return; }
    S.item = itemFind(o2);
    if (S.item) { if (checkCarried()) say(D.desc[S.item]); return; }
    if (eq(o2, 'tabliczkę')) { sign(); return; }
    const sc = D.scenery.find(e => eq(e[0], o2) && e[2] === S.loc);
    say(sc ? sc[1] : 'Nie możesz tego obejrzeć!');
  },
  read() {
    if (eq(o2, 'tabliczkę')) { sign(); return; }
    if (eq(o2, 'cennik')) {
      if (S.loc !== 22) say('Ale tu go nie ma !!');
      else say('Hamburger - 10000 zł.\nPiwo Leżajsk - 7500 zł\nPiwo Okocim - 6800 zł\nPiwo kuflowe - 4000 zł');
      return;
    }
    if (!check()) return;
    say(D.read[S.item] || 'Nic tu nie ma napisanego.');
  },
  drop() {
    if (eq(o2, 'gówno')) { say('Musisz jeszcze podać jego numer!'); return; }
    if (!check() || !checkCarried()) return;
    S.obj[S.item] = S.loc;
    inv();
  },
  drink() {
    if (isBeer()) {
      const idx = D.names.findIndex((n, i) => i >= 7 && i <= 9 && eq(n, o2));
      const targets = idx > 0 ? [idx] : [7, 8, 9];
      const have = targets.filter(i => S.obj[i] === CARRIED);
      if (!have.length) { say(idx > 0 ? 'Nie niesiesz tego przedmiotu!' : 'Chyba śnisz.'); return; }
      have.forEach(i => { S.obj[i] = NOWHERE; });
      say('O.k.');
      inv();
      return;
    }
    if (!hasArg() || eq(o2, 'wodę')) {
      if ([19, 20, 10].includes(S.loc)) say('A fe! Słona!');
      else if ([14, 13].includes(S.loc)) say('O.k.');
      else say('Tu nie ma żadnej wody!');
      return;
    }
    say('To niemożliwe.');
  },
  kill() {
    if (eq(o2, 'gospodarza')) {
      if (S.loc !== 23) say('Nie ma go tu.');
      else if (S.gosp === 1) say('Drugi raz ??');
      else { S.gosp = 1; say('Gospodarz pada na mordę nieżywy.'); }
      return;
    }
    if (eq(o2, 'rybaka')) {
      say(S.loc !== 5 || S.rybak === 2 ? 'Ale go tu nie ma!' : 'Nic z tego! Dostajesz tylko w ryło.');
      return;
    }
    if (S.loc === 3) {
      endGame(['Niestety, po ciemku nie widzisz, kogo atakujesz. Dostajesz w łeb i kończy Ci się wizja i fonia.', 'Gra jest skończona... Chyba nie żyjesz!']);
      return;
    }
    if (eq(o2, 'żula') || eq(o2, 'żuli')) {
      say(S.loc !== 22 ? 'Nie tutaj.' : 'Dostajesz w ryło tak potężnie, że lądujesz pod drzwiami.');
      return;
    }
    say(hasArg() ? 'To niemożliwe.' : 'Ale kogo ??');
  },
  fish() {
    if (![10, 19, 20, 13, 14, 8].includes(S.loc)) { say('Idiota! To się robi nad wodą!'); return; }
    if (hasArg() && !eq(o2, 'gówno')) { say('Nic z tego.'); return; }
    if (S.obj[12] !== CARRIED) { say('Ciekawe, czym!!'); return; }
    if (S.loc === 13) {
      if (S.zatoczka === 1) { say('A po co ?'); return; }
      S.obj[13] = 13;
      S.zatoczka = 1;
      say('Wyciągnąłeś przepiękne gówno!');
      return;
    }
    say('Kiepsko dziś biorą...');
  },
  open() {
    if (!hasArg()) { say('Ale co ??'); return; }
    if (!eq(o2, 'szkatułę')) { say('Nic tu się nie da otworzyć.'); return; }
    if (S.obj[2] !== CARRIED) { say('Nie masz klucza!'); return; }
    if (S.loc !== 4 || S.szkat === 0) { say('Nic tu takiego nie ma.'); return; }
    if (S.szkat === 2) { say('Ale ona jest już otwarta!'); return; }
    if (S.szkat === 3) { say('A w środku nic nie ma ...'); S.szkat = 2; return; }
    S.szkat = 2;
    S.obj[4] = 4;
    say('Wieko odpadło z trzaskiem ... W środku leży ... Gówno 1 !!!');
  },
  close() {
    if (!hasArg()) { say('Ale co ??'); return; }
    if (!eq(o2, 'szkatułę')) { say('Nie widzę tu nic do zamknięcia.'); return; }
    if (S.loc !== 4 || S.szkat === 0) { say('Nic tu takiego nie ma.'); return; }
    if (S.szkat === 1 || S.szkat === 3) { say('Ale ona jest zamknięta!'); return; }
    say('O.K.');
    S.szkat = 3;
    if (S.obj[4] === 4) { S.szkat = 1; S.obj[4] = NOWHERE; }
  },
  give() {
    if (S.loc === 5 && S.rybak === 0) {
      if (!hasArg()) { say('Ale co ??'); return; }
      if (!isBeer()) { say('Chcesz w ryj? Daj to, o co prosi!'); return; }
      if (S.obj[7] !== CARRIED && S.obj[8] !== CARRIED) { say('Chyba śnisz.'); return; }
      say('Rybak bierze całe twoje piwo.');
      S.obj[7] = NOWHERE;
      S.obj[8] = NOWHERE;
      S.rybak = 1;
      say('W zamian daje Ci żyłkę.');
      S.obj[10] = S.loc;
      return;
    }
    if (S.loc === 5 && S.rybak === 1) {
      if (!eq(o2, 'wędzisko')) { say('A po co mu to ?'); return; }
      if (S.obj[12] !== CARRIED) { say('Chcesz go oszukać ?'); return; }
      S.obj[12] = NOWHERE;
      S.rybak = 2;
      S.obj[14] = CARRIED;
      say('Rybak daje ci ogromną siekierę.');
      return;
    }
    if (S.loc === 9 && eq(o2, 'gówna')) {
      if (S.obj[21] !== CARRIED) endGame(['Za kantowanie - ścięcie łba!', 'Gra jest skończona... Chyba nie żyjesz!']);
      else endGame(['Wygrałeś!!!!!!!!!!!', 'Ha! Ha!']);
      return;
    }
    say('To ci się chyba nie uda.');
  },
  poop() {
    if (S.sram === 1) { say('Ale nie chce ci się!'); return; }
    if (S.loc === 17) { say('Gówno wpada z mokrym plaskiem do szamba.'); return; }
    S.obj[17] = S.loc;
    S.sram = 1;
    say('Zrobiłeś przepiękne gówno!');
  },
  wipe() {
    if (S.obj[16] !== CARRIED) { say('Czym? Ręką?!!'); return; }
    if (S.sram !== 1) { say('I po co ?'); return; }
    say('SZURU - BURU !');
    S.obj[16] = NOWHERE;
    S.obj[18] = CARRIED;
    S.sram = 2;
  },
  sit() { S.siad = 1; say('Ale dobrze...'); },
  stand() { S.siad = 0; say('Ok.'); },
  buy() {
    const shop = [['hamburgera', 10000, 6], ['piwo Leżajsk', 7500, 7], ['piwo Okocim', 6800, 8], ['piwo kuflowe', 4000, 9]];
    if (!hasArg()) { say('Ale co ??'); return; }
    if (S.loc !== 22) { say('Przecież handel obwoźny jest zabroniony.'); return; }
    const e = shop.find(x => eq(x[0], o2));
    if (!e) { say('Niestety, tego nie prowadzimy.'); return; }
    if (S.money < e[1]) { say('Nie stać cię!'); return; }
    S.money -= e[1];
    S.obj[e[2]] = CARRIED;
    say('Masz jeszcze ' + S.money + ' zł.');
    inv();
  },
  chop() {
    if (!hasArg()) { say('Ale co ??'); return; }
    if (S.obj[14] !== CARRIED) { say('Ciekawe, czym?'); return; }
    if (!eq(o2, 'drzewo')) { say('Akurat!'); return; }
    if (S.loc === 1) {
      if (S.drzewo === 1) { say('Drzewo jest już ścięte.'); return; }
      S.drzewo = 1;
      S.obj[15] = 1;
      S.exits[4][1] = 0;
      say('Drzewo wali się z ogromnym hukiem, a gówno z czubka spada u twych stóp.');
      return;
    }
    say(S.loc === 12 ? 'Możesz sobie tak rąbać. Tu jest sporo drzew.' : 'Coś ci odbiło ?');
  },
  craft() {
    if (!eq(o2, 'wędkę')) { say('Sraty-taty.'); return; }
    if (S.obj[5] !== CARRIED || S.obj[10] !== CARRIED || S.obj[11] !== CARRIED) { say('Nie masz czym.'); return; }
    S.obj[5] = S.obj[10] = S.obj[11] = NOWHERE;
    S.obj[12] = CARRIED;
    say('Masz teraz ogromne wędzisko!');
  },
  power() {
    if (hasArg() && !eq(o2, 'prąd') && !eq(o2, 'wyłącznik')) { say('Nie uda ci się to.'); return; }
    if (S.loc !== 23) { say('Nie ma tu nigdzie wyłącznika.'); return; }
    if (S.prad === 1) { say('Ale już to zrobiłeś!!'); return; }
    S.prad = 1;
    say('O.K.');
  },
  feed() {
    if (!hasArg()) { say('Ale kogo ??'); return; }
    if (eq(o2, 'żula')) { say(S.loc !== 22 ? 'Tu nie ma takiego.' : 'Nic z tego, dostałeś w ryło.'); return; }
    if (eq(o2, 'rybaka')) { say(S.loc !== 5 || S.rybak === 2 ? 'Tu nie ma takiego.' : 'On nie jest głodny.'); return; }
    if (eq(o2, 'eepcha')) {
      if (S.loc !== 24) { say('A gdzie go widzisz ?'); return; }
      if (S.obj[19] !== CARRIED) { say('Ale nie masz dla niego żarcia!'); return; }
      S.obj[19] = NOWHERE;
      S.obj[20] = S.loc;
      say('Eepch się nażarł - i z wdzięczności nasrał ci pod nogi !');
      return;
    }
    say('Ciekawe, jak chcesz to zrobić!');
  },
  dig() {
    if (S.obj[3] !== CARRIED) { say('Ale czym ??'); return; }
    if (S.loc !== 4) { say('Wykopałeś przepiękny dołek.'); return; }
    if (S.szkat === 1) { say('Masz zadatki na kopacza rowów.'); return; }
    S.szkat = 1;
    say('Wykopałeś (oprócz kości) starą szkatułę.');
  },
  eat() {
    if (!check() || !checkCarried()) return;
    const e = D.eat[S.item];
    say(e[0]);
    if (e[1]) S.obj[S.item] = NOWHERE;
  }
};

function submit(text) {
  text = text.trim().replace(/\s+/g, ' ');
  if (!text) return;
  say('> ' + text, 'echo');
  if (S.ended) {
    if (fold(text).startsWith('n')) { say('Do widzenia.'); cmdEl.disabled = goEl.disabled = true; }
    else { logEl.textContent = ''; newGame(); banner(); location(); }
    return;
  }
  if (S.confirmQuit) {
    S.confirmQuit = false;
    if (fold(text).startsWith('t')) { say('Do widzenia.'); cmdEl.disabled = goEl.disabled = true; return; }
  }
  const sp = text.indexOf(' ');
  o1 = sp < 0 ? text : text.slice(0, sp);
  o2 = sp < 0 ? null : text.slice(sp + 1);
  const c = D.cmds.find(e => eq(e[0], o1));
  if (!c) { say('Nie znam takiego polecenia.'); return; }
  H[c[1]](c[2]);
}

function fire() {
  const v = cmdEl.value;
  cmdEl.value = '';
  if (v.trim()) { history.push(v); histPos = history.length; }
  submit(v);
}

cmdEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') fire();
  else if (e.key === 'ArrowUp' && histPos > 0) { histPos--; cmdEl.value = history[histPos]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { histPos = Math.min(histPos + 1, history.length); cmdEl.value = history[histPos] || ''; e.preventDefault(); }
});
goEl.addEventListener('click', () => { fire(); cmdEl.focus(); });

newGame();
banner();
location();
cmdEl.focus();
})();
</script>
</body>
</html>
